# CONFIGURACIÓN PUENTE - Sistema de Integración Privada
# Este archivo actúa como orquestador central del sistema

sistema:
  nombre: "contenedor-superinteligencia"
  tipo: "puente-privado"
  estado: "activo"
  privacidad: "privado"

repositorios:
  contenedor:
    url: "https://github.com/yh6wfd5rn5-coder/contenedor"
    rol: "hub-central"
    descripcion: "Repositorio contenedor - punto de sincronización"
    
  tanque:
    url: "https://github.com/yenqin1ti-gif/tanque.git"
    rol: "módulo-procesamiento"
    rama: "feature/super-neurosis"
    descripcion: "Módulo de procesamiento de datos - tanque"
    ruta-local: "modules/tanque"
    
  nodriza-superinteligencia:
    url: "https://github.com/yh6wfd5rn5/nodriza-superinteligencia"
    rol: "módulo-ia"
    rama: "main"
    descripcion: "Módulo de superinteligencia e IA"
    ruta-local: "modules/nodriza"

sincronizacion:
  automática: true
  intervalo: "30min"
  rama-principal: "main"
  rama-desarrollo: "develop"

acceso:
  privado: true
  requiere-autenticacion: true
  tokens-ssh: "recomendado"
  contraseña-encriptada: "por-configurar"
